<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today fix — all-day chips preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- РЕАЛЬНЫЙ собранный CSS приложения -->
<link rel="stylesheet" href="../../frontend/dist/assets/index-HNCpBHae.css">
<style>
  body{background:#2a2a2e;margin:0;padding:28px;font-family:Geist,sans-serif;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .cap{font-family:"Geist Mono",monospace;font-size:12px;color:#8a8b91;margin:0 0 10px}
  .phone{width:390px;background:#0F0F11;border:1px solid rgba(255,255,255,.07);border-radius:28px;overflow:hidden}
</style></head>
<body>
  <div>
    <div class="cap">ПОСЛЕ фикса — all-day чипы (реальный CSS приложения)</div>
    <div class="phone">
      <div class="screen today">
        <div class="today-head">
          <div class="screen-hero today-pad today-hero-row" style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h1>Сегодня</h1>
              <div class="date today-date" style="text-transform:capitalize">вторник, 9 июня</div>
              <div class="today-summary">3 задач · 0 закрыто</div>
            </div>
            <button class="cal-today">Сегодня</button>
          </div>
          <!-- разметка 1:1 как в Today.tsx JSX -->
          <div class="cal-allday today-pad">
            <span class="cal-allday-label">весь<br>день</span>
            <div class="cal-allday-chips">
              <button class="cal-chip" style="background:#3FB68B22;color:#3FB68B;border-left-color:var(--danger)">Созвон с командой ZIMA</button>
              <button class="cal-chip" style="background:#5B8DEF22;color:#5B8DEF;border-left-color:var(--warning)">Записаться на анализы (расширенные)</button>
              <button class="cal-chip" style="background:var(--surface);color:var(--text);border-left-color:transparent">Прочитать статью без проекта</button>
            </div>
          </div>
        </div>
        <div style="padding:14px 16px;color:#8a8b91;font-family:'Geist Mono',monospace;font-size:11px;border-top:1px solid rgba(255,255,255,.07)">05:00 … таймлайн ниже …</div>
      </div>
    </div>
  </div>
</body></html>
